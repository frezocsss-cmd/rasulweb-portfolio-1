<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Sahifa topilmadi — Rasulweb.uz</title>
    <meta name="description" content="Kechirasiz, qidirgan sahifangiz topilmadi. Rasulweb.uz bosh sahifasiga qayting." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f4ed;
        color: #342d27;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-image: radial-gradient(ellipse at 50% 0%, rgba(184, 165, 138, 0.24), transparent 62%);
      }
      main {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
        text-decoration: none;
        color: #342d27;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      .brand span {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(91, 76, 59, 0.13);
        border-radius: 12px;
        background: #fffefa;
        color: #b8a58a;
        font-family: Georgia, "Cormorant Garamond", serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .code {
        color: #b8a58a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.28em;
      }
      h1 {
        margin: 14px 0 0;
        font-size: clamp(2rem, 8vw, 3.4rem);
        line-height: 1.06;
        letter-spacing: -0.03em;
      }
      h1 em {
        color: #b8a58a;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 500;
      }
      p {
        margin: 18px auto 0;
        max-width: 430px;
        color: #82796d;
        font-size: 15px;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      .primary {
        background: #342d27;
        color: #f7f4ed;
        box-shadow: 0 18px 45px -20px rgba(52, 45, 39, 0.9);
      }
      .secondary {
        border: 1px solid rgba(91, 76, 59, 0.13);
        background: rgba(255, 254, 250, 0.72);
        color: #342d27;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><span>R</span>RASULWEB.UZ</a>
      <div class="code">404 — SAHIFA TOPILMADI</div>
      <h1>Bu sahifa <em>mavjud emas</em>.</h1>
      <p>
        Kechirasiz, siz izlagan sahifa ko'chirilgan yoki o'chirilgan bo'lishi mumkin. Bosh sahifaga qaytib, xizmatlar
        va tariflar bilan tanishishingiz mumkin.
      </p>
      <div class="actions">
        <a class="primary" href="/">Bosh sahifaga qaytish</a>
        <a class="secondary" href="/#contact">Loyihani muhokala qilish</a>
      </div>
    </main>
  </body>
</html>
